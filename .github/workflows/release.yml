# 手动发布一版: 测试 → 构建多架构镜像推 GHCR → 建 Release (附两份 compose)。
#
#   Actions 页 → 发布 → Run workflow。三个输入都有默认值, 通常直接跑。
#
# ── 版本号来自 CHANGELOG.md, 不来自 tag ────────────────────────────────
# `scripts/version.sh` 取所有 `## ` 标题里最大的版本号。**tag 是发布的结果而不是
# 来源**: 靠 tag 意味着"先打 tag 再构建", 打错了还得删了重来; 更糟的是 tag 能指向
# 任意 commit, 于是"门禁测的代码"和"要发布的代码"可能不是同一份。现在 tag 由这条
# 流水线在发布成功后创建, 构建与门禁天然同一个 commit。
#
# 想临时发个别的号 (例如 0.11.0-rc.1), 用 version 输入覆盖。
#
# ── 只能手动触发 ────────────────────────────────────────────────────────
# push 不触发它, 每次 push 自动跑的只有 ci.yml。这里每一步都对外产生副作用
# (推 GHCR、顶掉 latest、建 Release), 该由人决定"现在发", 而不是由"我推了一行
# 代码"决定。门禁自动化, 发布手动化。
name: 发布

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号。留空 = 用 CHANGELOG.md 里最大的那个 (推荐)。填了则覆盖, 例如 0.11.0-rc.1'
        required: false
        default: ''
      publish:
        description: '真的发布? 取消勾选 = 照编照验, 但不推 GHCR / 不建 Release'
        type: boolean
        default: true
      prerelease:
        description: 'GitHub Release 标记为预发布?'
        type: boolean
        default: false
      on_conflict:
        description: '这个版本号已经发过了怎么办'
        type: choice
        options:
          - pre          # 自动加 -pre.N 发一个新的 (默认, 不动已发布的东西)
          - overwrite    # 覆盖: tag 移到当前 commit, Release 与镜像 tag 一并顶掉
          - fail         # 直接失败
        default: pre

# 一次发布跑到一半不该被顶掉 —— 中途取消会留下半成品镜像 tag / Release。
# 撞车时排队等前一个跑完。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write     # 建 release / 建 tag
  packages: write     # 推 GHCR

jobs:
  # 发布前的闸门: 测试不过就不发。复用 ci.yml, 不重复写一遍。
  gate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 要读已有 tag 才能判断本次是不是最大版本

      - name: 算出版本号与镜像 tag
        id: meta
        env:
          VERSION_IN: ${{ github.event.inputs.version }}
          REPO_IN: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -n "${VERSION_IN}" ]; then
            VERSION="${VERSION_IN#v}"
            echo "版本号来自手动输入: ${VERSION}"
          else
            VERSION="$(./scripts/version.sh)"
            echo "版本号来自 CHANGELOG.md: ${VERSION}"
            # 只有走 CHANGELOG 这条路时才校验副本一致 —— 手填的号 (rc 之类)
            # 本来就不要求仓库里的副本跟着改。
            ./scripts/version.sh --check
          fi

          VTAG="v${VERSION}"
          # GHCR 的路径必须全小写, 而 GitHub 用户名/仓库名可能带大写。
          REPO_LC="$(echo "${REPO_IN}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${REPO_LC}"

          # 版本号冲突怎么处理, 抽在 scripts/resolve-version.sh 里 —— 四个仓库
          # (repo_git / explore_journal / photo-ar / cc-trans) 用的是同一份逻辑,
          # 内联进 workflow 的话必然各改各的。
          # 不用 eval: 那是对脚本输出做求值, 而输出里的值来自 git tag 名。
          # 显式取四个键, 多几行换掉一个没必要的注入面。
          RV="$(./scripts/resolve-version.sh "${VERSION}" "${{ inputs.on_conflict }}")"
          VERSION="$(printf '%s\n' "$RV" | sed -n 's/^version=//p')"
          VTAG="$(printf '%s\n' "$RV" | sed -n 's/^vtag=//p')"
          PRERELEASE="$(printf '%s\n' "$RV" | sed -n 's/^prerelease=//p')"
          OVERWRITE="$(printf '%s\n' "$RV" | sed -n 's/^overwrite=//p')"

          # latest 只在**本次是最大版本**时才移动。
          #
          # 光看"是不是预发布"不够: 给 v0.9.0 发一个 hotfix 时, 那个判断会把
          # latest 从已经发布的 v0.10.0 拽回 0.9.0, 而 latest 正是 NAS 上
          # compose 默认拉的那个 —— 所有按 latest 部署的人会被静默降级。
          HIGHEST="$(
            { git tag -l 'v*'; echo "${VTAG}"; } \
              | sed 's/^v//' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1
          )"
          MOVE_LATEST=false
          if [ "${PRERELEASE}" = false ] && [ "${HIGHEST}" = "${VERSION}" ]; then
            MOVE_LATEST=true
          fi

          TAGS="${IMAGE}:${VTAG}"
          [ "${MOVE_LATEST}" = true ] && TAGS="${TAGS}"$'\n'"${IMAGE}:latest"

          {
            echo "version=${VERSION}"
            echo "vtag=${VTAG}"
            echo "repo=${REPO_IN}"
            echo "image=${IMAGE}:${VTAG}"
            echo "prerelease=${PRERELEASE}"
            echo "move_latest=${MOVE_LATEST}"
            echo "overwrite=${OVERWRITE}"
            echo "tags<<__TAGS_EOF__"
            echo "${TAGS}"
            echo "__TAGS_EOF__"
          } >> "$GITHUB_OUTPUT"

          echo "版本=${VERSION} 预发布=${PRERELEASE} 移动latest=${MOVE_LATEST} (现存最大=${HIGHEST})"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.publish }}
          platforms: linux/amd64,linux/arm64
          # 前端那一段在 Dockerfile 里钉了 --platform=$BUILDPLATFORM, 所以
          # npm install + vite build 只在 amd64 runner 上原生跑一次, 不进 QEMU。
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Voice Storage
            org.opencontainers.image.description=家庭杂物仓储管理 (语音/钉钉/Telegram/飞书 + 3D 可视化)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 确认镜像真的推上去了
        if: inputs.publish
        env:
          IMG: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          # build-push-action 成功不等于 registry 上真有这个 manifest (推送失败被
          # 缓存层掩盖过)。回读一次, 顺便把两个架构都列出来存证。
          docker buildx imagetools inspect "${IMG}" > /tmp/manifest.txt
          cat /tmp/manifest.txt
          for p in linux/amd64 linux/arm64; do
            grep -q "$p" /tmp/manifest.txt || { echo "::error::${IMG} 里没有 $p"; exit 1; }
          done
          echo "✅ ${IMG} 已在 GHCR 上, 双架构齐全"

      - name: 渲染两份 compose 与发布正文
        id: notes
        env:
          V: ${{ steps.meta.outputs.version }}
          VTAG: ${{ steps.meta.outputs.vtag }}
          IMG: ${{ steps.meta.outputs.image }}
          REPO: ${{ steps.meta.outputs.repo }}
          MOVE_LATEST: ${{ steps.meta.outputs.move_latest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ./scripts/render-compose.sh "${IMG}" cli > dist/compose.yml
          ./scripts/render-compose.sh "${IMG}" nas > dist/compose.nas.yml

          # 渲染出来的东西必须自己是合法的, 否则发布页上那份是坏的。
          docker compose -f dist/compose.yml     config -q
          docker compose -f dist/compose.nas.yml config -q
          # NAS 版的硬性要求: 非注释行里一个变量都不许剩 (图形界面不做插值)。
          if grep -v '^\s*#' dist/compose.nas.yml | grep -q '\${'; then
            echo "::error::compose.nas.yml 里还有没展开的变量"; exit 1
          fi

          sed -e "s|__VERSION__|${VTAG}|g" \
              -e "s|__IMAGE__|${IMG}|g" \
              -e "s|__REPO__|${REPO}|g" \
              .github/release-notes.md > dist/RELEASE_BODY.md

          # 把两份 compose 的完整内容嵌进发布正文 —— 发布页要让人直接抄, 而不是
          # 先下载一个文件再打开看。
          {
            echo
            echo '### 完整 compose (命令行 + `.env`)'
            echo
            echo '```yaml'
            cat dist/compose.yml
            echo '```'
            echo
            echo '### 完整 compose (NAS 图形界面直接粘)'
            echo
            echo '这份不含任何 `${变量}`。QNAP Container Station / 群晖 Container Manager 的 YAML 输入框**不做变量插值**, 粘一份带变量的进去会以 `invalid reference format` 失败。'
            echo
            echo '```yaml'
            cat dist/compose.nas.yml
            echo '```'
          } >> dist/RELEASE_BODY.md

          if grep -n '__VERSION__\|__IMAGE__\|__REPO__' dist/RELEASE_BODY.md; then
            echo "::error::还有没替换掉的占位符" && exit 1
          fi

          # 同一份内容也进 Actions 的运行摘要, 不用点进 Release 就能看到。
          cat dist/RELEASE_BODY.md >> "$GITHUB_STEP_SUMMARY"
          echo '✅ 两份 compose 渲染并校验通过'

      - name: "覆盖模式: 把 tag 移到当前 commit"
        # action-gh-release 遇到已存在的 tag 只会更新 Release, **不会移动 tag** ——
        # 那样资产是新的、tag 还指着旧 commit, 对不上。所以这里显式挪一次。
        if: inputs.publish && steps.meta.outputs.overwrite == 'true'
        env:
          VTAG: ${{ steps.meta.outputs.vtag }}
        run: |
          set -euo pipefail
          git tag -f "${VTAG}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${VTAG}"
          echo "已把 ${VTAG} 移到 ${GITHUB_SHA}"

      - name: 建 Release (顺带创建 tag) 并附上两份 compose
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          # tag 不需要事先存在 —— 这一步会在当前 commit 上创建它。
          tag_name: ${{ steps.meta.outputs.vtag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.vtag }}
          body_path: dist/RELEASE_BODY.md
          files: |
            dist/compose.yml
            dist/compose.nas.yml
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.move_latest }}

      - name: 收尾提示
        env:
          VTAG: ${{ steps.meta.outputs.vtag }}
          IMG: ${{ steps.meta.outputs.image }}
          MOVE_LATEST: ${{ steps.meta.outputs.move_latest }}
        run: |
          if [ "${{ inputs.publish }}" != "true" ]; then
            echo "::notice::演练模式: 镜像与 compose 都构建校验过了, 但没有推送, 也没建 Release。"
            exit 0
          fi
          echo "::notice::已发布 ${VTAG} —— 镜像 ${IMG}$([ "${MOVE_LATEST}" = true ] && echo ' (latest 已指向它)')"
          echo "::notice::GHCR 包若是私有, NAS 上会 pull 报 unauthorized: 到包设置改成 Public, 或在 NAS 上 docker login ghcr.io"
