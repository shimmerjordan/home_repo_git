# 常规检查: 后端测试 + AI 准确度回归 + 前端能不能编出来。
# 全程不联网调 LLM —— 准确度回归用 backend/eval/cassettes/ 里录好的响应回放,
# 所以 CI 不需要任何 API key, 也不会因为模型抖动变红。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:      # release.yml 把这个当发布前的闸门复用

# 同一 PR 连推两次不用等旧的跑完。group 里塞 github.workflow 是因为被 release.yml
# 当闸门复用(workflow_call)时, github.workflow 取的是调用方("Release")而不是
# "CI" —— 这样 PR/push 的正常 CI 运行和发布时的闸门运行天然落在不同 group, 不会互相取消。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试 + AI 准确度回放
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 装依赖
        run: pip install -r backend/requirements.txt

      - name: 单元 + 集成测试
        working-directory: backend/tests
        env:
          # 测试自己会建临时 sqlite 和临时 config, 这两个只是兜底,
          # 免得哪个模块在 import 期就去碰 /app/data。
          DATABASE_URL: 'sqlite://'
          CONFIG_PATH: '${{ runner.temp }}/ci-config.json'
          LOG_DIR: '${{ runner.temp }}/ci-logs'
        run: python -m unittest discover -s . -v

      - name: AI 准确度回归 (离线回放 cassette)
        working-directory: backend
        env:
          CONFIG_PATH: '${{ runner.temp }}/eval-config.json'
        run: |
          # --replay: 只读 eval/cassettes/, 缺 cassette 就报错而不是偷偷去打真 API。
          # 退出码非 0 表示有 case 不达预期。
          python -m eval.run_eval --replay

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  image:
    name: 镜像能构建 (amd64, 不推送)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 打 tag 发布时, release.yml 的 publish job 反正要重新构建 amd64+arm64 并推送,
    # 这里再构建一遍 amd64 纯属重复 (gha cache 还按 ref 分 scope, tag 上是冷缓存,
    # 等于全量构建两遍)。所以发布路径 (gate 复用本文件, event_name 仍是调用方的
    # push tag / workflow_dispatch) 跳过这个 job; PR 和 push 到 main 仍然验证。
    # push 到 main 时 ref_type 恒为 branch, push 一个 tag 时恒为 tag —— 用这个
    # 区分 "main 分支的日常验证" 和 "release 发布时的 gate", 不依赖额外输入。
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建 (只验证, 不推)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
