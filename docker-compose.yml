services:
  # 前后端同一个容器: nginx 反代同容器内的 uvicorn (127.0.0.1:8000), 后端不再对外暴露。
  app:
    build: .
    container_name: storage-app
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/data/storage.db
      - CONFIG_PATH=/app/data/config.json
      - LOG_DIR=/app/data/logs
      - CORS_ORIGINS=*
      - TZ=${TZ:-Asia/Shanghai}
      # 写进服务器证书 SAN 的地址(空格/逗号分隔多个), 让 iPad 用 https://... 装信任
      # 本地 CA 后零弹窗。IPv4 和主机名都收。
      #
      # **NAS 上优先填主机名**: 局域网 IP 多半是 DHCP 发的, 变一次就得改配置重签;
      # 而 mDNS 名字(QNAP/群晖 默认广播 <主机名>.local)跟着设备走, 填一次永久有效。
      #   LAN_HOSTS=nas.local        → https://nas.local:8443
      # 本机开发时 start.sh 会自动探测 IP 塞进 LAN_IP, 不用管这两个。
      - LAN_HOSTS=${LAN_HOSTS:-}
      - LAN_IP=${LAN_IP:-}
    ports:
      # HTTP 入口: 本机访问 / 下载 CA 证书 (http://<ip>:8080/ca.crt)
      - "${HTTP_PORT:-8080}:80"
      # HTTPS 入口: iPad/手机局域网用语音走这里
      - "${APP_PORT:-8443}:443"
    volumes:
      # 一个卷装全部持久化数据: storage.db / config.json / logs / certs。
      # certs 里的本地 CA 换了 iPad 就得重装, 所以别动这个路径。
      - ./data:/app/data

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: storage-whisper
    restart: unless-stopped
    environment:
      - ASR_MODEL=small
      - ASR_ENGINE=openai_whisper
    expose:
      - "9000"
    profiles: ["whisper"]
