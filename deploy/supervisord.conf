# 一个容器里带两个常驻进程 (uvicorn + nginx) 的进程管理。
# 注意: 证书签发不是 program —— 它必须在 nginx 启动前完成, 由 entrypoint.sh 跑完再
# exec 到这里, 见 deploy/entrypoint.sh。
[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
# nodaemon 模式下 supervisord 自己已经往 stdout 打一份日志, 这里再指 /dev/stdout 会
# 变成两个 handler, 每行输出重复一遍 —— 所以 logfile 丢到 /dev/null。
# 两个子进程的日志由各自的 stdout_logfile 走到容器 stdout, `./start.sh logs` 照样能看全。
logfile=/dev/null
logfile_maxbytes=0

# 留一个 socket, 方便 docker exec storage-app supervisorctl -c 本文件 status/restart
[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# priority 只决定 spawn 的先后, supervisord 不会等前一个进入 RUNNING 才起下一个 ——
# 所以后端 bind 8000 之前, nginx 已经在服务了, /api 会有几秒 502。静态页不受影响,
# 容器 HEALTHCHECK 探的是后端, start-period 40s 覆盖了这段窗口。
[program:backend]
command=/usr/local/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/app
priority=10
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
