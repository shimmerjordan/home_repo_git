# 语音仓储管家 — 用已发布的镜像部署 (不在本机编译)。
#
# 这个文件就是 GitHub Release 页上让你下载的 compose.yml。发布流水线会把下面的
# __IMAGE__ 替换成带版本号的镜像地址再作为 release 资产上传, 所以你从 release 页
# 下到的那份是**版本钉死**的 —— 想升级就换一行 image, 或者重新下新版本的这个文件。
#
# 仓库里保留这份带占位符的模板, 是为了让它跟代码一起被 review 和改动。
# 想自己从源码编译, 用仓库根目录的 docker-compose.yml (`./start.sh`)。
#
# 用法:
#   mkdir -p voice-storage && cd voice-storage
#   curl -fLO <release 页给的 compose.yml 链接>
#   printf 'LAN_IP=%s\n' "$(hostname -I | awk '{print $1}')" > .env
#   docker compose up -d
#
# 数据全在 ./data 里 (SQLite / 配置 / 日志 / 本地 CA), 备份就 tar 这一个目录。

services:
  app:
    image: __IMAGE__
    container_name: storage-app
    restart: unless-stopped
    # 只认本地已有的镜像会导致升级时悄悄用旧的; missing = 没有才拉, 有就用本地。
    # 想强制刷成远端最新: docker compose pull && docker compose up -d
    pull_policy: missing
    environment:
      - DATABASE_URL=sqlite:////app/data/storage.db
      - CONFIG_PATH=/app/data/config.json
      - LOG_DIR=/app/data/logs
      - CORS_ORIGINS=*
      - TZ=${TZ:-Asia/Shanghai}
      # 局域网 IP, 会写进服务器证书的 SAN —— iPad/手机走 https://<这个IP>:8443 用语音
      # 时证书才对得上。可空格/逗号分隔多个。留空只影响 HTTPS, HTTP 照常。
      # 放在同目录的 .env 里: LAN_IP=192.168.1.50
      - LAN_IP=${LAN_IP:-}
    ports:
      # HTTP: 日常访问 + 下载本地 CA 证书 (http://<ip>:8080/ca.crt)
      - "${HTTP_PORT:-8080}:80"
      # HTTPS: iPad/手机在局域网里用麦克风必须走这个 (浏览器要 secure context)
      - "${APP_PORT:-8443}:443"
    volumes:
      # 唯一的挂载点。certs/ 里的本地 CA 一旦重新生成, iPad 上就得重装证书,
      # 所以升级/迁移时**务必带上整个 data 目录**。
      - ./data:/app/data

  # 可选: 本地离线语音转写。不需要就别加 --profile whisper, 它不会被启动。
  # 服务名必须叫 whisper —— 后端按 docker DNS 名 http://whisper:9000 访问它。
  # 首次拉镜像约 2GB, ASR_MODEL=small 大概吃 1~2G 内存。
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: storage-whisper
    restart: unless-stopped
    environment:
      - ASR_MODEL=small
      - ASR_ENGINE=openai_whisper
    expose:
      - "9000"
    profiles: ["whisper"]
