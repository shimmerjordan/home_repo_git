# 80 / 443 两个 server 块共用的应用路由 (被 nginx.conf include)。
root /usr/share/nginx/html;
index index.html;

client_max_body_size 25M;

# 前端产物压缩: Scene3D chunk ~580KB / index ~230KB 以前裸传。Debian nginx 默认只压 text/html。
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types application/javascript text/css application/json image/svg+xml application/manifest+json;

# Vite 产物文件名带内容 hash, 可以放心让浏览器永久缓存; index.html 不缓存, 每次拿最新 hash。
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}
location = /index.html {
    add_header Cache-Control "no-cache";
}

# 本地 CA 证书下载: iPad/手机浏览器打开 /ca.crt 会提示"安装描述文件"。
# 用这个 content-type 让 iOS 识别为证书; 不加 attachment ——否则 iOS 会存进"文件"而非触发安装。
location = /ca.crt {
    default_type application/x-x509-ca-cert;
}

# 后端 API + 自动生成的文档。uvicorn 与 nginx 同容器, 只监听 127.0.0.1:8000,
# 所以走本机回环 (合并前是 http://backend:8000 走 docker 内网)。
location ~ ^/(api|docs|redoc|openapi.json)(/|$) {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location / {
    try_files $uri $uri/ /index.html;
}
